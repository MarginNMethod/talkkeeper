name: Release

# Pushing a version tag (for example v0.1.0) builds installers for macOS, Windows and
# Linux and attaches them to a DRAFT GitHub release that only maintainers can see.
# Running the workflow by hand (Actions -> Release -> Run workflow) does a test build
# and uploads the installers as workflow artifacts without creating any release. The same
# test build runs on pull requests that change this workflow or the app packaging.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  # Test-build the installers whenever a change touches this workflow or the app packaging.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "apps/desktop/src-tauri/tauri.conf.json"
      - "apps/desktop/src-tauri/Info.plist"

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          app=$(python3 -c "import json;print(json.load(open('apps/desktop/src-tauri/tauri.conf.json'))['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$app" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app version $app (apps/desktop/src-tauri/tauri.conf.json)."
            exit 1
          fi

  build:
    needs: check-version
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: ""
            rust_targets: ""
          - name: macOS (Intel)
            os: macos-latest
            args: "--target x86_64-apple-darwin"
            rust_targets: "x86_64-apple-darwin"
            # Cross-compiled on an Apple Silicon runner; a failure here must not block the rest.
            experimental: true
          - name: Windows
            os: windows-latest
            args: ""
            rust_targets: ""
          - name: Linux
            # An older Ubuntu keeps the Linux packages compatible with more distributions.
            os: ubuntu-22.04
            args: ""
            rust_targets: ""
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev libpulse-dev \
            libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev cmake clang

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Tag push: build and attach installers to a draft release.
      - name: Build and draft release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: TalkKeeper ${{ github.ref_name }}
          releaseBody: |
            Unsigned builds for macOS, Windows and Linux. See the README for how to open
            them the first time, and for the first-run setup that downloads the AI models.
          releaseDraft: true
          prerelease: true

      # Manual run: build only, keep installers as downloadable workflow artifacts.
      - name: Test build (no release)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        working-directory: apps/desktop
        shell: bash
        run: pnpm tauri build ${{ matrix.args }}

      - name: Upload test installers
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.name }}
          path: |
            target/**/release/bundle/dmg/*.dmg
            target/**/release/bundle/macos/*.app.tar.gz
            target/**/release/bundle/msi/*.msi
            target/**/release/bundle/nsis/*.exe
            target/**/release/bundle/deb/*.deb
            target/**/release/bundle/rpm/*.rpm
            target/**/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 7
