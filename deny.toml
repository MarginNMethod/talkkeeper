# BSL-1.0 (Boost) is permissive; used by the clipboard crates on Windows.
# Unlicense is a public-domain dedication (permissive); used by some transitive crates.
# CDLA-Permissive-2.0 covers the bundled TLS root-certificate data (webpki-roots).
# The LLVM exception adds permissions to Apache-2.0 (required by target-lexicon).
# NCSA is a permissive BSD-style license; image's AV1 codec lists libfuzzer-sys
# under cfg(fuzzing), which appears in all-target dependency license audits.
[licenses]
confidence-threshold = 0.8
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "MPL-2.0", "Unicode-3.0", "Unicode-DFS-2016", "CC0-1.0", "CDLA-Permissive-2.0", "Unlicense", "BSL-1.0", "NCSA"]
