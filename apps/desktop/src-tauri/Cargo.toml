[package]
name = "talkkeeper-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
talkkeeper-setup = { path = "../../../crates/setup" }
talkkeeper-core = { path = "../../../crates/core" }

talkkeeper-llm = { path = "../../../crates/llm" }
talkkeeper-templates = { path = "../../../crates/templates" }
talkkeeper-transcribe = { path = "../../../crates/transcribe", features = ["cloud"] }
talkkeeper-audio = { path = "../../../crates/audio", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
futures-util = "0.3"
rfd = "0.15"
arboard = { version = "3", default-features = false, features = ["image-data"] }

tauri-plugin-global-shortcut = "2"
enigo = { version = "0.6", default-features = false, features = ["x11rb"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
# macOS system audio needs the macOS 26 SDK (Xcode 26+) to compile.
macos-system-audio = ["talkkeeper-audio/macos-screencapture"]

[dev-dependencies]
async-trait = "0.1"
