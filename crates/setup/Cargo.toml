[package]
name = "talkkeeper-setup"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "fs", "io-util", "time", "sync"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }
futures-util = "0.3"
sysinfo = "0.33"
sha2 = "0.10"
tar = "0.4"
flate2 = "1"
zstd = "0.13"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"
talkkeeper-transcribe = { path = "../transcribe", default-features = false }
talkkeeper-llm = { path = "../llm" }

[dev-dependencies]
wiremock = "0.6"
