[package]
name = "talkkeeper-transcribe"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["whisper"]
whisper = ["dep:whisper-rs"]
cloud = ["dep:tokio-tungstenite"]

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time", "net"] }
tokio-stream = "0.1"
thiserror = "2"
rubato = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "multipart", "json"] }
sha2 = "0.10"
serde_json = "1"
url = "2"
whisper-rs = { version = "0.16", optional = true }
tokio-tungstenite = { version = "0.28", optional = true, features = ["rustls-tls-webpki-roots"] }

tempfile = "3"

[dev-dependencies]
hound = "3.5"
wiremock = "0.6"
